<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pilotage — Refonte web HEP Vaud</title>
<link rel="icon" href="assets/logo-hep.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#main">Aller au contenu</a>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand"><img src="assets/logo-hep.svg" alt="HEP Vaud" width="84" height="49"><div class="brand-t">Refonte web<br><span>Plateforme de pilotage</span></div></div>
    <nav id="nav" aria-label="Navigation principale"></nav>
    <div class="side-f small muted">v0.3 · 05.10.2026</div>
  </aside>
  <div class="mainwrap">
    <header class="top">
      <button class="btn ghost menu" id="menuBtn" aria-label="Ouvrir le menu">☰</button>
      <div class="top-t"><h1 id="viewTitle">Vue d'ensemble</h1><div class="sub" id="projSub"></div></div>
      <div class="top-r"><span class="pill" id="todayPill"></span><button class="pill" id="userPill" title="Changer d'utilisateur"></button><span class="pill save" id="saveState" role="status" aria-live="polite">—</span></div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div class="modal-bg" id="modalBg" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-h"><h2 id="modalTitle"></h2><button class="btn ghost" id="modalClose" aria-label="Fermer">✕</button></div><div class="modal-b" id="modalBody"></div><div class="modal-f" id="modalFoot"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="data/projet-data.js"></script>
<script src="js/core.js"></script>
<script src="js/analytics.js"></script>
<script src="js/views-a.js"></script>
<script src="js/views-b.js"></script>
<script src="js/views-c.js"></script>
<script src="js/app.js"></script>
</body>
</html>
